[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "niw-bo"
version = "0.2.0"
description = "Human-in-the-loop multi-objective Bayesian optimization of Ni-W electrodeposition with Ax"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "Michail Mitsakis", email = "mitsakismichail@gmail.com" }]
dependencies = [
    "ax-platform>=1.3,<1.4",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab"]
baybe = ["baybe>=0.15,<0.16"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/niw_bo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: fits the surrogate model and generates candidates"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
